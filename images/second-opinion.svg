<text x="1000" y="968" class="tag" fill="#9e3d18" text-anchor="middle">THE SLOW ROAD</text>
<text x="1000" y="1000" class="cap" fill="#9e3d18" text-anchor="middle">Slow every change and the overhead climbs. A contractor who would</text>
<text x="1000" y="1027" class="cap" fill="#9e3d18" text-anchor="middle">have left happy with its margin finds its motivation, and something to claim.</text>
