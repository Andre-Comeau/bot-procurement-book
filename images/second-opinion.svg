<text x="126" y="410" class="tag" fill="#ffffff" text-anchor="start">1 · BEFORE THE TENDER</text>
<text x="126" y="462" class="name" fill="#ffffff" text-anchor="start">The Estimator</text>
<text x="126" y="502" class="q" fill="#ffffff" text-anchor="start">“How much should</text>
<text x="126" y="530" class="q" fill="#ffffff" text-anchor="start">this cost?”</text>
