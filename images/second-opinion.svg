<text x="760" y="952" class="small" fill="#9e3d18" text-anchor="middle">10 working days</text>
<text x="760" y="974" class="smalli" fill="#9e3d18" text-anchor="middle">(a service standard)</text>
<text x="1240" y="816" class="tag2" fill="#9e3d18" text-anchor="start">OVERHEAD</text>
