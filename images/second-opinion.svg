<text x="600" y="762" class="tag" fill="#2c2c2a" text-anchor="middle">2 · TENDER DAY</text>
<text x="600" y="796" class="cap" fill="#2c2c2a" text-anchor="middle">The envelopes open. For one</text>
<text x="600" y="823" class="cap" fill="#2c2c2a" text-anchor="middle">afternoon, the buyer knows</text>
<text x="600" y="850" class="cap" fill="#2c2c2a" text-anchor="middle">the market price.</text>
<rect x="850" y="292" width="360" height="142" rx="16" fill="#0f6e56"/>
