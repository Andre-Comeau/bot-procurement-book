<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<style>
  .eyebrow{font-family:Outfit,sans-serif;font-weight:600;font-size:15px;letter-spacing:.16em;fill:#0064ff}
  .title{font-family:'Instrument Serif',Georgia,serif;font-size:54px;fill:#2c2c2a}
  .dek{font-family:Lora,Georgia,serif;font-size:20px;fill:#5f5e5a}
  .tag{font-family:Outfit,sans-serif;font-weight:600;font-size:16px;letter-spacing:.14em}
  .name{font-family:'Instrument Serif',Georgia,serif;font-size:46px}
  .q{font-family:Lora,Georgia,serif;font-style:italic;font-weight:500;font-size:24px}
  .ex{font-family:Outfit,sans-serif;font-weight:500;font-size:21px}
  .mid{font-family:'Instrument Serif',Georgia,serif;font-size:26px}
  .mids{font-family:Lora,Georgia,serif;font-style:italic;font-size:17px}
  .route{font-family:'Instrument Serif',Georgia,serif;font-size:25px;paint-order:stroke;stroke:#f9f8f5;stroke-width:8px;stroke-linejoin:round}
  .foot{font-family:Outfit,sans-serif;font-size:16px;fill:#5f5e5a}
</style>
<rect width="1600" height="900" fill="#f9f8f5"/>
<text x="80" y="78" class="eyebrow" text-anchor="start">CHAPTER 9</text>
<text x="80" y="136" class="title" text-anchor="start">A second opinion on every price</text>
<text x="80" y="176" class="dek" text-anchor="start">One engine, pointed either side of tender day.</text>
<rect x="80" y="300" width="520" height="400" rx="18" fill="#0064ff"/>
<text x="120" y="356" class="tag" fill="#ffffff" text-anchor="start">BEFORE THE TENDER</text>
<text x="120" y="416" class="name" fill="#ffffff" text-anchor="start">The Estimator</text>
<text x="120" y="466" class="q" fill="#ffffff" text-anchor="start">“How much should this cost?”</text>
<text x="120" y="536" class="ex" fill="#ffffff" text-anchor="start">Prices every line from past bids</text>
<text x="120" y="574" class="ex" fill="#ffffff" text-anchor="start">Learns from what the market paid</text>
<text x="120" y="612" class="ex" fill="#ffffff" text-anchor="start">Error rate known on unseen contracts</text>
<text x="120" y="650" class="ex" fill="#ffffff" text-anchor="start">Within about 10% at the total</text>
<rect x="1000" y="300" width="520" height="400" rx="18" fill="#0f6e56"/>
<text x="1040" y="356" class="tag" fill="#ffffff" text-anchor="start">AFTER AWARD</text>
<text x="1040" y="416" class="name" fill="#ffffff" text-anchor="start">The Evaluator</text>
<text x="1040" y="466" class="q" fill="#ffffff" text-anchor="start">“Are we paying too much?”</text>
<text x="1040" y="536" class="ex" fill="#ffffff" text-anchor="start">Prices a change in minutes, not days</text>
<text x="1040" y="574" class="ex" fill="#ffffff" text-anchor="start">Cites the past tenders behind each price</text>
<text x="1040" y="612" class="ex" fill="#ffffff" text-anchor="start">Flags rare items, never prices them silently</text>
<text x="1040" y="650" class="ex" fill="#ffffff" text-anchor="start">A named keyholder decides and signs</text>
<rect x="640" y="300" width="320" height="400" rx="18" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
<text x="800.0" y="356" class="tag" fill="#5f5e5a" text-anchor="middle">TENDER DAY</text>
<rect x="688.0" y="410" width="84" height="58" rx="4" fill="#ffffff" stroke="#2c2c2a" stroke-width="2.5"/>
<path d="M688.0 410 L730.0 442 L772.0 410" fill="none" stroke="#2c2c2a" stroke-width="2.5"/>
<rect x="758.0" y="424" width="84" height="58" rx="4" fill="#ffffff" stroke="#2c2c2a" stroke-width="2.5"/>
<path d="M758.0 424 L800.0 456 L842.0 424" fill="none" stroke="#2c2c2a" stroke-width="2.5"/>
<rect x="828.0" y="410" width="84" height="58" rx="4" fill="#ffffff" stroke="#2c2c2a" stroke-width="2.5"/>
<path d="M828.0 410 L870.0 442 L912.0 410" fill="none" stroke="#2c2c2a" stroke-width="2.5"/>
<text x="800.0" y="536" class="mid" fill="#2c2c2a" text-anchor="middle">The envelopes open:</text>
<text x="800.0" y="566" class="mid" fill="#2c2c2a" text-anchor="middle">for one afternoon, the</text>
<text x="800.0" y="596" class="mid" fill="#2c2c2a" text-anchor="middle">market is in the room.</text>
<text x="800.0" y="650" class="mids" fill="#5f5e5a" text-anchor="middle">After award, every change</text>
<text x="800.0" y="676" class="mids" fill="#5f5e5a" text-anchor="middle">is bought from a supplier of one.</text>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>
<path d="M520 294 C 720 230, 880 230, 1080 294" fill="none" stroke="#0064ff" stroke-width="3" marker-end="url(#ah)"/>
<text x="800.0" y="244" class="route" fill="#004fcc" text-anchor="middle">Its price and error rate become the evaluator’s yardstick</text>
<path d="M1080 706 C 880 770, 720 770, 520 706" fill="none" stroke="#d85a30" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#ah)"/>
<text x="800.0" y="778" class="route" fill="#9e3d18" text-anchor="middle">Every checked price becomes evidence for the next estimate</text>
<text x="80" y="860" class="foot" text-anchor="start">A slow review on every change raises the overhead, and a motivated contractor can always find something to claim against. The evaluator’s savings come after the tender.</text>
</svg>