<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1210" width="1600" height="1210"><style>
.eyebrow{font:600 22px "IBM Plex Sans",Arial,sans-serif;letter-spacing:.12em;fill:#5f5e5a}
.title{font:700 54px Georgia,"Times New Roman",serif;fill:#2c2c2a}
.dek{font:400 24px "IBM Plex Sans",Arial,sans-serif;fill:#5f5e5a}
.lab{font:700 30px Georgia,serif}
.sub{font:italic 400 20px "IBM Plex Sans",Arial,sans-serif}
.note{font:400 20px "IBM Plex Sans",Arial,sans-serif}
.verdict{font:700 24px Georgia,serif}
.plate{font:700 24px "IBM Plex Sans",Arial,sans-serif}
.micro{font:600 12px "IBM Plex Sans",Arial,sans-serif;letter-spacing:.06em}
.foot{font:italic 400 19px "IBM Plex Sans",Arial,sans-serif}
</style><rect width="1600" height="1210" fill="#f9f8f5"/><text x="80" y="86" class="eyebrow" text-anchor="start">CHAPTER 1 · FOUR WAYS TO ANSWER A FLOODED DOOR</text><text x="80" y="148" class="title" text-anchor="start">Four ways to answer a flooded door</text><text x="80" y="190" class="dek" text-anchor="start">Software has four answers to a flooded interface. Construction has a twin for each,</text><text x="80" y="218" class="dek" text-anchor="start">and the twins show which answers a public buyer can live with.</text><rect x="128" y="278" width="224" height="332" fill="#8d8c88" stroke="#2c2c2a" stroke-width="7"/><rect x="140" y="290" width="200" height="320" fill="#a4a3a0" stroke="#2c2c2a" stroke-width="3"/><rect x="162" y="316" width="156" height="110" rx="3" fill="none" stroke="#2c2c2a" stroke-width="2" opacity="0.5"/><rect x="162" y="460" width="156" height="120" rx="3" fill="none" stroke="#2c2c2a" stroke-width="2" opacity="0.5"/><circle cx="306" cy="455" r="8" fill="#2c2c2a"/><rect x="180" y="352" width="120" height="40" rx="4" fill="#ffffff" stroke="#2c2c2a" stroke-width="2.5"/><text x="240.0" y="380" class="plate" text-anchor="middle" fill="#2c2c2a">2 a month</text><rect x="105" y="530" width="10" height="80" rx="3" fill="#b6512f"/><circle cx="110" cy="526" r="9" fill="#b6512f"/><rect x="365" y="530" width="10" height="80" rx="3" fill="#b6512f"/><circle cx="370" cy="526" r="9" fill="#b6512f"/><path d="M110,534 q130.0,56 260,0" fill="none" stroke="#d85a30" stroke-width="6" stroke-linecap="round"/><text x="80" y="680" class="lab" text-anchor="start" fill="#2c2c2a">Cap</text><text x="80" y="710" class="sub" text-anchor="start" fill="#5f5e5a">limit how often anyone may call</text><text x="80" y="754" class="note" fill="#2c2c2a"><tspan font-weight="700">Online.</tspan> Clarkesworld closed its</text><text x="80" y="781" class="note" text-anchor="start" fill="#2c2c2a">door. arXiv allows two papers a</text><text x="80" y="808" class="note" text-anchor="start" fill="#2c2c2a">month.</text><text x="80" y="847" class="note" fill="#2c2c2a"><tspan font-weight="700">Construction.</tspan> The shortlist,</text><text x="80" y="874" class="note" text-anchor="start" fill="#2c2c2a">allowed only when it is</text><text x="80" y="901" class="note" text-anchor="start" fill="#2c2c2a">announced in advance with the</text><text x="80" y="928" class="note" text-anchor="start" fill="#2c2c2a">criteria stated.</text><text x="80" y="967" class="verdict" text-anchor="start" fill="#b6512f">Hits good and bad</text><text x="80" y="997" class="verdict" text-anchor="start" fill="#b6512f">callers alike.</text><rect x="493" y="278" width="224" height="332" fill="#8d8c88" stroke="#2c2c2a" stroke-width="7"/><rect x="505" y="290" width="200" height="320" fill="#a4a3a0" stroke="#2c2c2a" stroke-width="3"/><rect x="527" y="316" width="156" height="110" rx="3" fill="none" stroke="#2c2c2a" stroke-width="2" opacity="0.5"/><rect x="527" y="460" width="156" height="120" rx="3" fill="none" stroke="#2c2c2a" stroke-width="2" opacity="0.5"/><circle cx="671" cy="455" r="8" fill="#2c2c2a"/><circle cx="605.0" cy="440" r="22" fill="#2c2c2a"/><path d="M593.0,450 l-10,52 h44 l-10,-52 z" fill="#2c2c2a"/><path d="M749,380 q0,-14 12,-14" fill="none" stroke="#2c2c2a" stroke-width="3"/><circle cx="749" cy="410" r="18" fill="none" stroke="#b6512f" stroke-width="7"/><path d="M749,428 v78 M749,470 h14 M749,490 h20" fill="none" stroke="#b6512f" stroke-width="7" stroke-linecap="round"/><text x="445" y="680" class="lab" text-anchor="start" fill="#2c2c2a">Key</text><text x="445" y="710" class="sub" text-anchor="start" fill="#5f5e5a">decide who may call</text><text x="445" y="754" class="note" fill="#2c2c2a"><tspan font-weight="700">Online.</tspan> Tighter rules on who</text><text x="445" y="781" class="note" text-anchor="start" fill="#2c2c2a">may vouch for a newcomer.</text><text x="445" y="820" class="note" fill="#2c2c2a"><tspan font-weight="700">Construction.</tspan> Prequalification</text><text x="445" y="847" class="note" text-anchor="start" fill="#2c2c2a">and capacity ratings. Trade law</text><text x="445" y="874" class="note" text-anchor="start" fill="#2c2c2a">bars a public buyer from</text><text x="445" y="901" class="note" text-anchor="start" fill="#2c2c2a">requiring prior contracts.</text><text x="445" y="940" class="verdict" text-anchor="start" fill="#b6512f">Says who sent it, not</text><text x="445" y="970" class="verdict" text-anchor="start" fill="#b6512f">whether it is right.</text><rect x="858" y="278" width="224" height="332" fill="#8d8c88" stroke="#2c2c2a" stroke-width="7"/><rect x="870" y="290" width="200" height="320" fill="#a4a3a0" stroke="#2c2c2a" stroke-width="3"/><rect x="892" y="316" width="156" height="110" rx="3" fill="none" stroke="#2c2c2a" stroke-width="2" opacity="0.5"/><rect x="892" y="460" width="156" height="120" rx="3" fill="none" stroke="#2c2c2a" stroke-width="2" opacity="0.5"/><circle cx="1036" cy="455" r="8" fill="#2c2c2a"/><rect x="912.0" y="410" width="116" height="60" rx="6" fill="#ffffff" stroke="#2c2c2a" stroke-width="2.5"/><rect x="944.0" y="434" width="52" height="12" rx="3" fill="#2c2c2a"/><text x="970.0" y="428" class="micro" text-anchor="middle" fill="#5f5e5a">INSERT BOND</text><circle cx="1116" cy="440" r="26" fill="#e0a526" stroke="#2c2c2a" stroke-width="3"/><circle cx="1116" cy="440" r="17" fill="none" stroke="#2c2c2a" stroke-width="2" opacity="0.6"/><text x="810" y="680" class="lab" text-anchor="start" fill="#2c2c2a">Fee</text><text x="810" y="710" class="sub" text-anchor="start" fill="#5f5e5a">charge for each call</text><text x="810" y="754" class="note" fill="#2c2c2a"><tspan font-weight="700">Online.</tspan> Make the sender pay,</text><text x="810" y="781" class="note" text-anchor="start" fill="#2c2c2a">proposed in 1992. A price high</text><text x="810" y="808" class="note" text-anchor="start" fill="#2c2c2a">enough to stop spam blocks</text><text x="810" y="835" class="note" text-anchor="start" fill="#2c2c2a">honest senders too.</text><text x="810" y="874" class="note" fill="#2c2c2a"><tspan font-weight="700">Construction.</tspan> The bid bond.</text><text x="810" y="901" class="note" text-anchor="start" fill="#2c2c2a">Participation falls wherever a</text><text x="810" y="928" class="note" text-anchor="start" fill="#2c2c2a">charge is levied.</text><text x="810" y="967" class="verdict" text-anchor="start" fill="#b6512f">Falls hardest on the</text><text x="810" y="997" class="verdict" text-anchor="start" fill="#b6512f">newcomers.</text><rect x="1223" y="278" width="224" height="332" fill="#8d8c88" stroke="#2c2c2a" stroke-width="7"/><rect x="1235" y="290" width="200" height="320" fill="#f1d69d"/><path d="M1235,290 L1353,324 L1353,586 L1235,610 Z" fill="#15614d" stroke="#2c2c2a" stroke-width="3"/><circle cx="1335" cy="460" r="7" fill="#2c2c2a"/><rect x="1445" y="330" width="84" height="110" rx="3" fill="#ffffff" stroke="#2c2c2a" stroke-width="2.5"/><path d="M1455,352 l5,5 l9,-11" fill="none" stroke="#15614d" stroke-width="2.5" stroke-linecap="round"/><line x1="1475" y1="352" x2="1517" y2="352" stroke="#5f5e5a" stroke-width="2.5" opacity="0.6"/><path d="M1455,370 l5,5 l9,-11" fill="none" stroke="#15614d" stroke-width="2.5" stroke-linecap="round"/><line x1="1475" y1="370" x2="1517" y2="370" stroke="#5f5e5a" stroke-width="2.5" opacity="0.6"/><path d="M1455,388 l5,5 l9,-11" fill="none" stroke="#15614d" stroke-width="2.5" stroke-linecap="round"/><line x1="1475" y1="388" x2="1517" y2="388" stroke="#5f5e5a" stroke-width="2.5" opacity="0.6"/><path d="M1455,406 l5,5 l9,-11" fill="none" stroke="#15614d" stroke-width="2.5" stroke-linecap="round"/><line x1="1475" y1="406" x2="1517" y2="406" stroke="#5f5e5a" stroke-width="2.5" opacity="0.6"/><path d="M1455,424 l5,5 l9,-11" fill="none" stroke="#15614d" stroke-width="2.5" stroke-linecap="round"/><line x1="1475" y1="424" x2="1517" y2="424" stroke="#5f5e5a" stroke-width="2.5" opacity="0.6"/><text x="1487" y="464" class="micro" text-anchor="middle" fill="#5f5e5a">the rules,</text><text x="1487" y="480" class="micro" text-anchor="middle" fill="#5f5e5a">posted</text><text x="1175" y="680" class="lab" text-anchor="start" fill="#2c2c2a">Published check</text><text x="1175" y="710" class="sub" text-anchor="start" fill="#5f5e5a">check every call against rules</text><text x="1175" y="736" class="sub" text-anchor="start" fill="#5f5e5a">anyone can read</text><text x="1175" y="780" class="note" fill="#2c2c2a"><tspan font-weight="700">Online.</tspan> From 2024, bulk mail</text><text x="1175" y="807" class="note" text-anchor="start" fill="#2c2c2a">must authenticate under public</text><text x="1175" y="834" class="note" text-anchor="start" fill="#2c2c2a">standards. Unauthenticated mail</text><text x="1175" y="861" class="note" text-anchor="start" fill="#2c2c2a">fell by about 65 percent.</text><text x="1175" y="900" class="note" fill="#2c2c2a"><tspan font-weight="700">Construction.</tspan> The price read</text><text x="1175" y="927" class="note" text-anchor="start" fill="#2c2c2a">against the market&#x27;s record,</text><text x="1175" y="954" class="note" text-anchor="start" fill="#2c2c2a">and claims pointed at evidence.</text><text x="1175" y="993" class="verdict" text-anchor="start" fill="#15614d">The only answer that</text><text x="1175" y="1023" class="verdict" text-anchor="start" fill="#15614d">scales without shutting</text><text x="1175" y="1053" class="verdict" text-anchor="start" fill="#15614d">anyone out.</text><line x1="80" y1="1082" x2="1520" y2="1082" stroke="#e5e7eb" stroke-width="2"/><text x="80" y="1120" class="note" text-anchor="start" fill="#2c2c2a">Each of the first three helps one party at another&#x27;s expense. The buyer gets less to read, and the newcomer gets the door.</text><text x="80" y="1170" class="foot" text-anchor="start" fill="#5f5e5a">Highway construction already has all four in rough form. The written parts of a bid have none, and that is where the thicket is growing.</text></svg>