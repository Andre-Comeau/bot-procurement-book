ke-width="1.5"/><rect x="718.8" y="558" width="160" height="12" fill="#ffffff" stroke="#2c2c2a" stroke-width="1.5"/><rect x="716.4" y="546" width="160" height="12" fill="#ffffff" stroke="#2c2c2a" stroke-width="1.5"/><rect x="724.4" y="549" width="34" height="6" fill="#d85a30"/><rect x="723.3" y="534" width="160" height="12" fill="#ffffff" stroke="#2c2c2a" stroke-width="1.5"/><rect x="716.9" y="524" width="160" height="10" fill="#ffffff" stroke="#2c2c2a" stroke-width="1.5"/><rect x="715.2" y="512" width="160" height="12" fill="#ffffff" stroke="#2c2c2a" stroke-width="1.5"/><rect x="720.6" y="498" width="160" height="14" fill="#ffffff" stroke="#2c2c2a" stroke-width="1.5"/><rect x="718.7" y="484" width="160" height="14" fill="#ffffff" stroke="#2c2c2a" stroke-width="1.5"/><rect x="726.7" y="487" width="34" height="8" fill="#d85a30"/><rect x="717.9" y="468" width="160" height="16" fill="#ffffff" stroke="#2c2c2a" stroke-width="1.5"/><rect x="715.5" y="452" width="160" height="16" fill="#ffffff" stroke="#2c2c2a" stroke-width="1.5"/><rect x="720.9" y="436" width="160" height="16" fill="#ffffff" stroke="#2c2c2a" stroke-width="1.5"/><rect x="725.0" y="372" width="150" height="44" rx="6" fill="#ffffff" stroke="#2c2c2a" stroke-width="3"/><text x="800" y="406" class="lab" text-anchor="middle" fill="#2c2c2a">the door</text><rect x="685.0" y="927" width="230" height="44" rx="6" fill="#ffffff" stroke="#2c2c2a" stroke-width="3"/><text x="800" y="961" class="note" text-anchor="middle" fill="#2c2c2a">a stack of PDFs</text><line x1="600" y1="540" x2="980" y2="540" stroke="#0064ff" stroke-width="8" stroke-linecap="round"/><path d="M1000,540 l-26,-16 l0,32 z" fill="#0064ff"/><rect x="601.0" y="481" width="398.0" height="34" rx="17" fill="#ffffff" stroke="#0959d4" stroke-width="2.5"/><text x="800" y="505" class="note" text-anchor="middle" fill="#0959d4">the call: the bill of quantities</text><line x1="1000" y1="700" x2="620" y2="700" stroke="#0f6e56" stroke-width="8" stroke-linecap="round"/><path d="M600,700 l26,-16 l0,32 z" fill="#0f6e56"/><rect x="675.75" y="641" width="248.5" height="34" rx="17" fill="#ffffff" stroke="#15614d" stroke-width="2.5"/><text x="800" y="665" class="note" text-anchor="middle" fill="#15614d">the answer: the bid</text><text x="80" y="1060" class="foot" text-anchor="start" fill="#5f5e5a">Schematic. The one medium both sides can read is the one the compiler cannot open.</text></svg>