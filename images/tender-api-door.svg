" rx="3" fill="#0f6e56" opacity="0.85"/><rect x="1410" y="633" width="70" height="14" rx="3" fill="#0064ff" opacity="0.85"/><rect x="1370" y="660" width="90" height="14" rx="3" fill="#d85a30" opacity="0.85"/><text x="1040" y="760" class="note" text-anchor="start" fill="#5f5e5a">How the builder schedules its crews.</text><text x="1040" y="790" class="note" text-anchor="start" fill="#5f5e5a">The designer need not know.</text><text x="1040" y="832" class="note" text-anchor="start" fill="#2c2c2a">One door means one builder answers for</text><text x="1040" y="860" class="note" text-anchor="start" fill="#2c2c2a">everything behind it, whoever it hires.</text><text x="1040" y="888" class="note" text-anchor="start" fill="#2c2c2a">A surety stands behind the builder.</text><text x="120" y="860" class="note" text-anchor="start" fill="#2c2c2a">The design is tested once, by each bidder,</text><text x="120" y="888" class="note" text-anchor="start" fill="#2c2c2a">in the few weeks before the bids close.</text><rect x="706" y="416" width="188" height="484" fill="#acaba8" stroke="#2c2c2a" stroke-width="8"/><rect x="719.9" y="884" width="160" height="10" fill="#ffffff" stroke="#2c2c2a" stroke-width="1.5"/><rect x="715.4" y="870" width="160" height="14" fill="#ffffff" stroke="#2c2c2a" stroke-width="1.5"/><rect x="721.6" y="858" width="160" height="12" fill="#ffffff" stroke="#2c2c2a" stroke-width="1.5"/><rect x="729.6" y="861" width="34" height="6" fill="#d85a30"/><rect x="724.7" y="842" width="160" height="16" fill="#ffffff" stroke="#2c2c2a" stroke-width="1.5"/><rect x="718.2" y="828" width="160" height="14" fill="#ffffff" stroke="#2c2c2a" stroke-width="1.5"/><rect x="717.7" y="818" width="160" height="10" fill="#ffffff" stroke="#2c2c2a" stroke-width="1.5"/><rect x="722.3" y="806" width="160" height="12" fill="#ffffff" stroke="#2c2c2a" stroke-width="1.5"/><rect x="724.1" y="790" width="160" height="16" fill="#ffffff" stroke="#2c2c2a" stroke-width="1.5"/><rect x="732.1" y="793" width="34