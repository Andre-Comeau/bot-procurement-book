</style><rect width="1600" height="1100" fill="#f9f8f5"/><text x="80" y="86" class="eyebrow" text-anchor="start">CHAPTER 1 · THE TENDER IS THE API</text><text x="80" y="148" class="title" text-anchor="start">One door between two rooms</text><text x="80" y="190" class="dek" text-anchor="start">The design and the construction negotiate through the tender. The bill of quantities is the call every bidder makes,</text><text x="80" y="218" class="dek" text-anchor="start">and the bid is the answer that comes back. Nobody has to read the other side&#x27;s source code.</text><rect x="80" y="300" width="520" height="600" fill="#e6efff" stroke="#2c2c2a" stroke-width="6"/><rect x="210.0" y="272" width="260" height="44" rx="6" fill="#ffffff" stroke="#2c2c2a" stroke-width="3"/><text x="340.0" y="306" class="lab" text-anchor="middle" fill="#2c2c2a">The design</text><rect x="1000" y="300" width="520" height="600" fill="#e1f5ee" stroke="#2c2c2a" stroke-width="6"/><rect x="1130.0" y="272" width="260" height="44" rx="6" fill="#ffffff" stroke="#2c2c2a" stroke-width="3"/><text x="1260.0" y="306" class="lab" text-anchor="middle" fill="#2c2c2a">The construction</text><g transform="translate(190,560) scale(1.8)"><path d="M-8,40 v18 M8,40 v18" stroke="#2c2c2a" stroke-width="5" stroke-linecap="round"/><path d="M-12,58 h8 M4,58 h8" stroke="#2c2c2a" stroke-width="5" stroke-linecap="round"/><path d="M-16,14 q16,-6 32,0 l3,28 h-38 z" fill="#0959d4" stroke="#2c2c2a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="0" cy="0" r="11" fill="#e2b48c" stroke="#2c2c2a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M-11,-2 q2,-12 11,-12 q9,0 11,12 q-4,-6 -11,-6 q-7,0 -11,6 z" fill="#2c2c2a"/><circle cx="-4" cy="1" r="1.6" fill="#2c2c2a"/><circle cx="4" cy="1" r="1.6" fill="#2c2c2a"/><circle cx="-4.5" cy="1" r="4" fill="none" stroke="#2c2c2a" stroke-width="1.6"/><circle cx="4.5" cy="1" r="4" fill="none" stroke="#2c2c2a" stroke-width="1.6"/><path d="M-0.5,1 h1" stroke="#2c2c2a" stroke-width="1.6"/><path d="M-16,16 l-8,18 M16,16 l8,18" stroke="#2c2c2a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" fill="none"/></g><rect x="300" y="500" width="260" height="190" rx="4" fill="#ffffff" stroke="#2c2c2a" stroke-width="3"/><path d="M370,540 h120 v16 h-46 v60 h46 v16 h-120 v-16 h46 v-60 h-46 z" fill="#bfd8ff" stroke="#2c2c2a" stroke-width="2.5"/><path d="M330,540 v92 M322,540 h16 M322,632 h16" stroke="#5f5e5a" stroke-width="1.5"/><path d="M370,660 h120 M370,652 v16 M490,652 v16" stroke="#5f5e5a" stroke-width="1.5"/><text x="430" y="530" class="tiny" text-anchor="middle" fill="#5f5e5a">W610 × 125</text><text x="120" y="760" class="note" text-anchor="start" fill="#5f5e5a">Why the engineer chose that beam.</text><text x="120" y="790" class="note" text-anchor="start" fill="#5f5e5a">The builder need not know.</text><g transform="translate(1215,505) scale(2.1)"><path d="M-8,40 v18 M8,40 v18" stroke="#2c2c2a" stroke-width="5" stroke-linecap="round"/><path d="M-12,58 h8 M4,58 h8" stroke="#2c2c2a" stroke-width="5" stroke-linecap="round"/><path d="M-16,14 q16,-6 32,0 l3,28 h-38 z" fill="#555450" stroke="#2c2c2a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M-5,11 l5,6 l5,-6" fill="#ffffff" stroke="#2c2c2a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M0,17 l-3,14 l3,4 l3,-4 z" fill="#2c2c2a"/><circle cx="0" cy="0" r="11" fill="#c68a5e" stroke="#2c2c2a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M-11,-2 q2,-12 11,-12 q9,0 11,12 q-4,-6 -11,-6 q-7,0 -11,6 z" fill="#2c2c2a"/><circle cx="-4" cy="1" r="1.6" fill="#2c2c2a"/><circle cx="4" cy="1" r="1.6" fill="#2c2c2a"/><path d="M-16,16 l-8,18 M16,16 l8,18" stroke="#2c2c2a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" fill="none"/></g><g transform="translate(1130,575) scale(1.8)"><path d="M-8,40 v18 M8,40 v18" stroke="#2c2c2a" stroke-width="5" stroke-