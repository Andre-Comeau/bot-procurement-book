</style><rect width="1600" height="1300" fill="#f9f8f5"/><text x="80" y="86" class="eyebrow" text-anchor="start">THE UNDERWRITERS&#x27; CHAPTER · THE INSURABLE EVENT</text><text x="80" y="148" class="title" text-anchor="start">One losing job is not a claim</text><text x="80" y="190" class="dek" text-anchor="start">Each mug is a completed job, filled to the margin it made against the costs declared on bid day.</text><text x="80" y="218" class="dek" text-anchor="start">The policy only looks at the average across a broad spectrum of tenders.</text><text x="80" y="290" class="lab" text-anchor="start" fill="#2c2c2a">A normal year</text><text x="80" y="320" class="note" text-anchor="start" fill="#5f5e5a">A few jobs come up short. The bot still did its job on average.</text><path d="M150,470.0 q26.6,0 26.6,30.0 t-26.6,30.0" fill="none" stroke="#2c2c2a" stroke-width="5"/><rect x="80" y="461.6" width="70" height="98.4" fill="#0f6e56" opacity="0.85"/><rect x="80" y="440" width="70" height="120" rx="6" fill="none" stroke="#2c2c2a" stroke-width="4"/><path d="M104.5,430 q-8,-10 0,-20 t0,-20" fill="none" stroke="#5f5e5a" stroke-width="3" opacity="0.5"/><path d="M125.5,430 q-8,-10 0,-20 t0,-20" fill="none" stroke="#5f5e5a" stroke-width="3" opacity="0.5"/><path d="M272,470.0 q26.6,0 26.6,30.0 t-26.6,30.0" fill="none" stroke="#2c2c2a" stroke-width="5"/><rect x="202" y="468.8" width="70" height="91.2" fill="#0f6e56" opacity="0.85"/><rect x="202" y="440" width="70" height="120" rx="6" fill="none" stroke="#2c2c2a" stroke-width="4"/><path d="M226.5,430 q-8,-10 0,-20 t0,-20" fill="none" stroke="#5f5e5a" stroke-width="3" opacity="0.5"/><path d="M247.5,430 q-8,-10 0,-20 t0,-20" fill="none" stroke="#5f5e5a" stroke-width="3" opacity="0.5"/><path d="M394,470.0 q26.6,0 26.6,30.0 t-26.6,30.0" fill="none" stroke="#2c2c2a" stroke-width="5"/><rect x="324" y="512.0" width="70" height="48.0" fill="#d85a30" opacity="0.85"/><rect x="324" y="440" width="70" height="120" rx="6" fill="none" stroke="#2c2c