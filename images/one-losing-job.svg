1108" class="note" text-anchor="start" fill="#5f5e5a">bidder&#x27;s own share.</text><text x="80" y="1260" class="foot" text-anchor="start" fill="#5f5e5a">Schematic, not data: the levels show the idea, not test results.</text></svg>