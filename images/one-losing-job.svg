roke="#2c2c2a" stroke-width="4"/><path d="M958.5,430 q-8,-10 0,-20 t0,-20" fill="none" stroke="#5f5e5a" stroke-width="3" opacity="0.5"/><path d="M979.5,430 q-8,-10 0,-20 t0,-20" fill="none" stroke="#5f5e5a" stroke-width="3" opacity="0.5"/><line x1="68" y1="476.0" x2="1016" y2="476.0" stroke="#15614d" stroke-width="3" stroke-dasharray="10 7"/><line x1="68" y1="494.0" x2="1016" y2="494.0" stroke="#b6512f" stroke-width="3" stroke-dasharray="4 6"/><text x="1050" y="520.0" class="big" text-anchor="middle" fill="#2c2c2a">=</text><line x1="1086" y1="420.0" x2="1294" y2="420.0" stroke="#15614d" stroke-width="3" stroke-dasharray="10 7"/><line x1="1086" y1="450.0" x2="1294" y2="450.0" stroke="#b6512f" stroke-width="3" stroke-dasharray="4 6"/><path d="M1230,410.0 q46.8,0 46.8,50.0 t-46.8,50.0" fill="none" stroke="#2c2c2a" stroke-width="6"/><rect x="1100" y="420.8" width="130" height="139.2" fill="#0f6e56" opacity="0.85"/><rect x="1100" y="360" width="130" height="200" rx="8" fill="none" stroke="#2c2c2a" stroke-width="5"/><text x="1165.0" y="596" class="note" text-anchor="middle" fill="#5f5e5a">the average</text><text x="1304" y="428.0" class="note" text-anchor="start" fill="#15614d">target margin</text><text x="1304" y="458.0" class="note" text-anchor="start" fill="#b6512f">trigger</text><text x="1304" y="520" class="verdict" text-anchor="start" fill="#15614d">No payment</text><text x="1304" y="554" class="note" text-anchor="start" fill="#5f5e5a">The average stays above</text><text x="1304" y="582" class="note" text-anchor="start" fill="#5f5e5a">the trigger. The losses on</text><text x="1304" y="610" class="note" text-anchor="start" fill="#5f5e5a">single jobs stay with the bidder.</text><text x="80" y="760" class="lab" text-anchor="start" fill="#2c2c2a">A bad year</text><text x="80" y="790" class="note" text-anchor="start" fill="#5f5e5a">Most jobs fall short. The bot missed its promised margin.</text><path d="M150,940.0 q26.6,0 26.6,30.0 t-26.6,30.0" fill="none" stroke="#2c2c2