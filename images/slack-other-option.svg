,564.7 L896.0,554.1 L900.0,543.1 L904.0,531.7 L908.0,519.9 L912.0,507.8 L916.0,495.2 L920.0,482.3 L924.0,469.0 L928.0,455.2 L932.0,441.1 L936.0,426.6 L940.0,411.7 L944.0,396.4 L948.0,380.6 L952.0,364.5 L956.0,348.0 L960.0,331.0" fill="none" stroke="#d85a30" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="960" cy="331.0" r="7" fill="#d85a30" stroke="#f9f8f5" stroke-width="2"/><circle cx="960" cy="600" r="7" fill="#0064ff" stroke="#f9f8f5" stroke-width="2"/><text x="152" y="306" class="axis" text-anchor="start" fill="#5f5e5a">how many</text><text x="320.0" y="834" class="axis" text-anchor="middle" fill="#5f5e5a">the plan room</text><text x="620.0" y="834" class="axis" text-anchor="middle" fill="#5f5e5a">the plan room online</text><text x="860.0" y="834" class="axis" text-anchor="middle" fill="#5f5e5a">AI makes the call nearly free</text><text x="560.0" y="862" class="axisnote" text-anchor="middle" fill="#5f5e5a">time, left to right</text><text x="310" y="650" class="lab" text-anchor="middle" fill="#15614d">slack</text><text x="310" y="677" class="note" text-anchor="middle" fill="#2c2c2a">the oak kept the stack of bids</text><text x="310" y="702" class="note" text-anchor="middle" fill="#2c2c2a">small enough for a committee to read</text><text x="870" y="450" class="lab" text-anchor="end" fill="#b6512f">the thicket</text><text x="870" y="478" class="note" text-anchor="end" fill="#2c2c2a">slack released without</text><text x="870" y="504" class="note" text-anchor="end" fill="#2c2c2a">the capacity to meet it</text><line x1="910" y1="301.0" x2="946" y2="301.0" stroke="#d85a30" stroke-width="3.5"/><text x="900" y="307.0" class="note" text-anchor="end" fill="#2c2c2a">bids arriving at the door</text><line x1="176" y1="574" x2="216" y2="574" stroke="#0064ff" stroke-width="3.5"/><text x="226" y="580" class="note" text-anchor="start" fill="#2c2c2a">the attention available to read them</text><line x1="160" y1="324" x2="196" y2="324" stroke="#d85a30" stroke-width="3.5"/><text x="206" y="330" class="legend" text-anchor="start" fill="#5f5e5a">bids per tender</text><line x1="390" y1="324" x2="426" y2="324" stroke="#0064ff" stroke-width="3.5"/><text x="436" y="330" class="legend" text-anchor="start" fill="#5f5e5a">eyes to read them</text><text x="1040" y="334" class="lab" text-anchor="start" fill="#2c2c2a">Galbraith&#x27;s two choices</text><rect x="1040" y="360" width="480" height="242" rx="8" fill="#e5e7eb" stroke="#555450" stroke-width="3"/><text x="1064" y="404" class="boxtitle" text-anchor="start" fill="#555450">Add slack</text><text x="1064" y="438" class="note" text-anchor="start" fill="#2c2c2a">More time, more money, more cushion between</text><text x="1064" y="463" class="note" text-anchor="start" fill="#2c2c2a">the parts: a longer tender period, a cushion</text><text x="1064" y="488" class="note" text-anchor="start" fill="#2c2c2a">in the bid for the drawings&#x27; errors, a</text><text x="1064" y="513" class="note" text-anchor="start" fill="#2c2c2a">contingency for the rest.</text><text x="1064" y="544" class="tiny" text-anchor="start" fill="#5f5e5a">Construction&#x27;s habit. It no longer works: AI</text><text x="1064" y="567" class="tiny" text-anchor="start" fill="#5f5e5a">removed the slack and left the attention</text><text x="1064" y="590" class="tiny" text-anchor="start" fill="#5f5e5a">needed exactly where it was.</text><rect x="1040" y="632" width="480" height="242" rx="8" fill="#e1f5ee" stroke="#15614d" stroke-width="3"/><text x="1064" y="676" class="boxtitle" text-anchor="start" fill="#15614d">Raise the capacity</text><text x="1064" y="710" class="note" text-anchor="start" fill="#2c2c2a">Better systems and shorter lines between the</text><text x="1064" y="735" class="note" text-anchor="start" fill="#2c2c2a">people who need to talk: the same check,</text><text x="1064" y="760" class="note" text-anchor="start" fill="#2c2c2a">applied the same way to every bid.</text><text x="1064" y="791" class="tiny" text-anchor="start" fill="#5f5e5a">The other option. More data moves faster</text><text x="1064" y="814" class="tiny" text-anchor="start" fill="#5f5e5a">through the door without anyone acquiring a</text><text x="1064" y="837" class="tiny" text-anchor="start" fill="#5f5e5a">say they did not have before.</text><text x="80" y="960" class="foot" text-anchor="start" fill="#5f5e5a">Schematic, not data: the lines show the idea, not counts.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>