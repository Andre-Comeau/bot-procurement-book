<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200"><style>
.eyebrow{font:600 22px "IBM Plex Sans",Arial,sans-serif;letter-spacing:.12em;fill:#5f5e5a}
.title{font:700 54px Georgia,"Times New Roman",serif;fill:#2c2c2a}
.dek{font:400 23px "IBM Plex Sans",Arial,sans-serif;fill:#5f5e5a}
.lab{font:700 30px Georgia,serif}
.station{font:700 22px Georgia,serif}
.note{font:400 20px "IBM Plex Sans",Arial,sans-serif}
.cell{font:400 21px "IBM Plex Sans",Arial,sans-serif}
.mini{font:600 17px "IBM Plex Sans",Arial,sans-serif}
.foot{font:italic 400 19px "IBM Plex Sans",Arial,sans-serif}
</style><rect width="1600" height="1200" fill="#f9f8f5"/><text x="80" y="86" class="eyebrow" text-anchor="start">CHAPTER 6 · SLACK, AND THE OTHER OPTION</text><text x="80" y="148" class="title" text-anchor="start">Slack, and the other option</text><text x="80" y="190" class="dek" text-anchor="start">An organization facing more than it can process has two choices, Galbraith wrote: add slack, or raise its capacity to</text><text x="80" y="218" class="dek" text-anchor="start">process information. Construction has always chosen slack. Here is where this book finds it, and what the project puts in its place.</text><text x="80" y="302" class="lab" text-anchor="start" fill="#555450">Add slack</text><text x="80" y="332" class="note" text-anchor="start" fill="#5f5e5a">construction&#x27;s habit: more time, more money, more cushion between the parts</text><line x1="80" y1="348" x2="660" y2="348" stroke="#555450" stroke-width="3"/><text x="940" y="302" class="lab" text-anchor="start" fill="#15614d">Raise the capacity</text><text x="940" y="332" class="note" text-anchor="start" fill="#5f5e5a">the other option: the same check for every bid, with a record</text><line x1="940" y1="348" x2="1520" y2="348" stroke="#15614d" stroke-width="3"/><line x1="800" y1="374" x2="800" y2="1026" stroke="#e5e7eb" stroke-width="3"/><rect x="80" y="380" width="580" height="96" rx="8" fill="#e5e7eb" stroke="#555450" stroke-width="1.5"/><text x="102" y="414" class="cell" text-anchor="start" fill="#2c2c2a">Bug-free drawings are a mythical beast, so the bid</text><text x="102" y="440" class="cell" text-anchor="start" fill="#2c2c2a">carries a cushion for their errors.</text><rect x="940" y="380" width="580" height="96" rx="8" fill="#e1f5ee" stroke="#15614d" stroke-width="1.5"/><text x="962" y="414" class="cell" text-anchor="start" fill="#2c2c2a">A second opinion on every price: a check that</text><text x="962" y="440" class="cell" text-anchor="start" fill="#2c2c2a">flags a line for the firm&#x27;s own review before the</text><text x="962" y="466" class="cell" text-anchor="start" fill="#2c2c2a">bid goes in.</text><circle cx="800" cy="396" r="9" fill="#f9f8f5" stroke="#2c2c2a" stroke-width="3"/><text x="800" y="432" class="station" text-anchor="middle" fill="#2c2c2a" stroke="#f9f8f5" stroke-width="10" paint-order="stroke" stroke-linejoin="round">The drawings</text><rect x="80" y="490" width="580" height="96" rx="8" fill="#e5e7eb" stroke="#555450" stroke-width="1.5"/><text x="102" y="524" class="cell" text-anchor="start" fill="#2c2c2a">A long tender period, a plan room and an</text><text x="102" y="550" class="cell" text-anchor="start" fill="#2c2c2a">evaluation committee, built for a few large</text><text x="102" y="576" class="cell" text-anchor="start" fill="#2c2c2a">bidders and time to read.</text><rect x="940" y="490" width="580" height="96" rx="8" fill="#e1f5ee" stroke="#15614d" stroke-width="1.5"/><text x="962" y="524" class="cell" text-anchor="start" fill="#2c2c2a">The tender as a data file, and the same check</text><text x="962" y="550" class="cell" text-anchor="start" fill="#2c2c2a">applied the same way to every bid: same bid, same</text><text x="962" y="576" class="cell" text-anchor="start" fill="#2c2c2a">answer, a measured miss rate.</text><circle cx="800" cy="506" r="9" fill="#f9f8f5" stroke="#2c2c2a" stroke-width="3"/><text x="800" y="542" class="station" text-anchor="middle" fill="#2c2c2a" stroke="#f9f8f5" stroke-width="10" paint-order="stroke" stroke-linejoin="round">The tender</text><rect x="80" y="600" width="580" height="96" rx="8" fill="#e5e7eb" stroke="#555450" stroke-width="1.5"/><text x="102" y="634" class="cell" text-anchor="start" fill="#2c2c2a">The oak: an estimating department, a bonding line</text><text x="102" y="660" class="cell" text-anchor="start" fill="#2c2c2a">and the patience to lose five bids in six, billed</text><text x="102" y="686" class="cell" text-anchor="start" fill="#2c2c2a">as overhead to the jobs that are won.</text><rect x="940" y="600" width="580" height="96" rx="8" fill="#e1f5ee" stroke="#15614d" stroke-width="1.5"/><text x="962" y="634" class="cell" text-anchor="start" fill="#2c2c2a">A published check reads a thousand bids the same</text><text x="962" y="660" class="cell" text-anchor="start" fill="#2c2c2a">way, so the door stays open without a cap, a key</text><text x="962" y="686" class="cell" text-anchor="start" fill="#2c2c2a">or a fee, and the cost to bid drops.</text><circle cx="800" cy="616" r="9" fill="#f9f8f5" stroke="#2c2c2a" stroke-width="3"/><text x="800" y="652" class="station" text-anchor="middle" fill="#2c2c2a" stroke="#f9f8f5" stroke-width="10" paint-order="stroke" stroke-linejoin="round">The cost of bidding</text><rect x="80" y="710" width="580" height="96" rx="8" fill="#e5e7eb" stroke="#555450" stroke-width="1.5"/><text x="102" y="744" class="cell" text-anchor="start" fill="#2c2c2a">The contingency carries a cushion for the rest,</text><text x="102" y="770" class="cell" text-anchor="start" fill="#2c2c2a">and every change is a purchase from a supplier of</text><text x="102" y="796" class="cell" text-anchor="start" fill="#2c2c2a">one, reviewed by whoever has time.</text><rect x="940" y="710" width="580" height="96" rx="8" fill="#e1f5ee" stroke="#15614d" stroke-width="1.5"/><text x="962" y="744" class="cell" text-anchor="start" fill="#2c2c2a">The evaluator prices each line of a change and</text><text x="962" y="770" class="cell" text-anchor="start" fill="#2c2c2a">hands it to the keyholder, who signs with a reason</text><text x="962" y="796" class="cell" text-anchor="start" fill="#2c2c2a">and leaves a record of what was checked.</text><circle cx="800" cy="726" r="9" fill="#f9f8f5" stroke="#2c2c2a" stroke-width="3"/><text x="800" y="762" class="station" text-anchor="middle" fill="#2c2c2a" stroke="#f9f8f5" stroke-width="10" paint-order="stroke" stroke-linejoin="round">After the award</text><rect x="80" y="820" width="580" height="96" rx="8" fill="#e5e7eb" stroke="#555450" stroke-width="1.5"/><text x="102" y="854" class="cell" text-anchor="start" fill="#2c2c2a">The margin eats the error: a miss the size of the</text><text x="102" y="880" class="cell" text-anchor="start" fill="#2c2c2a">winner&#x27;s lead is the year&#x27;s profit on the job, and</text><text x="102" y="906" class="cell" text-anchor="start" fill="#2c2c2a">the surety stands behind the firm.</text><rect x="940" y="820" width="580" height="96" rx="8" fill="#e1f5ee" stroke="#15614d" stroke-width="1.5"/><text x="962" y="854" class="cell" text-anchor="start" fill="#2c2c2a">Insurance on the margin picks up the tails a</text><text x="962" y="880" class="cell" text-anchor="start" fill="#2c2c2a">probabilistic tool will always have, priced from</text><text x="962" y="906" class="cell" text-anchor="start" fill="#2c2c2a">the test&#x27;s measured misses.</text><circle cx="800" cy="836" r="9" fill="#f9f8f5" stroke="#2c2c2a" stroke-width="3"/><text x="800" y="872" class="station" text-anchor="middle" fill="#2c2c2a" stroke="#f9f8f5" stroke-width="10" paint-order="stroke" stroke-linejoin="round">Who pays</text><rect x="80" y="930" width="580" height="96" rx="8" fill="#e5e7eb" stroke="#555450" stroke-width="1.5"/><text x="102" y="964" class="cell" text-anchor="start" fill="#2c2c2a">Taylorism&#x27;s gains have plateaued, and so has the</text><text x="102" y="990" class="cell" text-anchor="start" fill="#2c2c2a">largest firm: it bids on a lot and works on a lot,</text><text x="102" y="1016" class="cell" text-anchor="start" fill="#2c2c2a">and its size stays where it is.</text><rect x="940" y="930" width="580" height="96" rx="8" fill="#e1f5ee" stroke="#15614d" stroke-width="1.5"/><text x="962" y="964" class="cell" text-anchor="start" fill="#2c2c2a">A standard: a template and a record, a public</text><text x="962" y="990" class="cell" text-anchor="start" fill="#2c2c2a">test, and a market memory anyone can read against,</text><text x="962" y="1016" class="cell" text-anchor="start" fill="#2c2c2a">so more workers step into principal roles.</text><circle cx="800" cy="946" r="9" fill="#f9f8f5" stroke="#2c2c2a" stroke-width="3"/><text x="800" y="982" class="station" text-anchor="middle" fill="#2c2c2a" stroke="#f9f8f5" stroke-width="10" paint-order="stroke" stroke-linejoin="round">The whole industry</text><line x1="80" y1="1056" x2="1520" y2="1056" stroke="#e5e7eb" stroke-width="2"/><text x="80" y="1096" class="cell" text-anchor="start" fill="#2c2c2a">What changed: AI made the call nearly free. It did not remove the uncertainty. It removed the slack, and left the</text><text x="80" y="1124" class="cell" text-anchor="start" fill="#2c2c2a">attention needed exactly where it was. The thicket is slack released without the capacity to meet it.</text><line x1="1250" y1="1112" x2="1470" y2="1112" stroke="#0064ff" stroke-width="3" stroke-linecap="round"/><path d="M1250.0,1142.0 L1252.2,1141.9 L1254.4,1141.8 L1256.6,1141.6 L1258.8,1141.5 L1261.0,1141.4 L1263.2,1141.3 L1265.4,1141.2 L1267.6,1141.0 L1269.8,1140.9 L1272.0,1140.8 L1274.2,1140.7 L1276.4,1140.5 L1278.6,1140.4 L1280.8,1140.3 L1283.0,1140.2 L1285.2,1140.0 L1287.4,1139.9 L1289.6,1139.8 L1291.8,1139.6 L1294.0,1139.5 L1296.2,1139.4 L1298.4,1139.2 L1300.6,1139.1 L1302.8,1138.9 L1305.0,1138.8 L1307.2,1138.6 L1309.4,1138.5 L1311.6,1138.3 L1313.8,1138.1 L1316.0,1137.9 L1318.2,1137.8 L1320.4,1137.6 L1322.6,1137.4 L1324.8,1137.2 L1327.0,1137.0 L1329.2,1136.7 L1331.4,1136.5 L1333.6,1136.3 L1335.8,1136.0 L1338.0,1135.8 L1340.2,1135.5 L1342.4,1135.2 L1344.6,1134.9 L1346.8,1134.6 L1349.0,1134.3 L1351.2,1134.0 L1353.4,1133.6 L1355.6,1133.3 L1357.8,1132.9 L1360.0,1132.5 L1362.2,1132.1 L1364.4,1131.7 L1366.6,1131.2 L1368.8,1130.8 L1371.0,1130.3 L1373.2,1129.8 L1375.4,1129.2 L1377.6,1128.7 L1379.8,1128.1 L1382.0,1127.5 L1384.2,1126.9 L1386.4,1126.3 L1388.6,1125.6 L1390.8,1124.9 L1393.0,1124.2 L1395.2,1123.5 L1397.4,1122.7 L1399.6,1121.9 L1401.8,1121.0 L1404.0,1120.2 L1406.2,1119.2 L1408.4,1118.3 L1410.6,1117.3 L1412.8,1116.3 L1415.0,1115.3 L1417.2,1114.2 L1419.4,1113.1 L1421.6,1111.9 L1423.8,1110.7 L1426.0,1109.5 L1428.2,1108.2 L1430.4,1106.8 L1432.6,1105.5 L1434.8,1104.0 L1437.0,1102.6 L1439.2,1101.0 L1441.4,1099.5 L1443.6,1097.9 L1445.8,1096.2 L1448.0,1094.5 L1450.2,1092.7 L1452.4,1090.8 L1454.6,1088.9 L1456.8,1087.0 L1459.0,1085.0 L1461.2,1082.9 L1463.4,1080.8 L1465.6,1078.6 L1467.8,1076.3 L1470.0,1074.0" fill="none" stroke="#d85a30" stroke-width="3" stroke-linecap="round"/><text x="1482" y="1118" class="mini" text-anchor="start" fill="#2c2c2a">eyes</text><text x="1482" y="1078" class="mini" text-anchor="start" fill="#2c2c2a">bids</text><text x="80" y="1160" class="foot" text-anchor="start" fill="#5f5e5a">A ledger, not data: each cell is a sentence of the book, shortened; the two lines on the right show the idea, not counts.</text></svg>