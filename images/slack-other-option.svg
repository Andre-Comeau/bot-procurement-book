</style><rect width="1600" height="1000" fill="#f9f8f5"/><text x="80" y="86" class="eyebrow" text-anchor="start">CHAPTER 6 · SLACK, AND THE OTHER OPTION</text><text x="80" y="148" class="title" text-anchor="start">Slack, and the other option</text><text x="80" y="190" class="dek" text-anchor="start">An organization facing more than it can process has two choices, Galbraith wrote: add slack, or raise its capacity</text><text x="80" y="218" class="dek" text-anchor="start">to process information. Construction has always chosen slack. AI took the slack away and left the attention needed where it was.</text><polygon points="160.0,745.0 164.0,744.8 168.0,744.7 172.0,744.5 176.0,744.4 180.0,744.2 184.0,744.0 188.0,743.9 192.0,743.7 196.0,743.6 200.0,743.4 204.0,743.2 208.0,743.1 212.0,742.9 216.0,742.8 220.0,742.6 224.0,742.4 228.0,742.3 232.0,742.1 236.0,742.0 240.0,741.8 244.0,741.6 248.0,741.5 252.0,741.3 256.0,741.2 260.0,741.0 264.0,740.8 268.0,740.7 272.0,740.5 276.0,740.4 280.0,740.2 284.0,740.0 288.0,739.9 292.0,739.7 296.0,739.6 300.0,739.4 304.0,739.2 308.0,739.1 312.0,738.9 316.0,738.8 320.0,738.6 324.0,738.4 328.0,738.3 332.0,738.1 336.0,738.0 340.0,737.8 344.0,737.6 348.0,737.5 352.0,737.3 356.0,737.2 360.0,737.0 364.0,736.8 368.0,736.7 372.0,736.5 376.0,736.4 380.0,736.2 384.0,736.0 388.0,735.9 392.0,735.7 396.0,735.6 400.0,735.4 404.0,735.2 408.0,735.1 412.0,734.9 416.0,734.8 420.0,734.6 424.0,734.4 428.0,734.3 432.0,734.1 436.0,734.0 440.0,733.8 444.0,733.6 448.0,733.5 452.0,733.3 456.0,733.2 460.0,733.0 464.0,732.8 468.0,732.7 472.0,732.5 476.0,732.4 480.0,732.2 484.0,732.0 488.0,731.9 492.0,731.7 496.0,731.6 500.0,731.4 504.0,731.2 508.0,731.1 512.0,730.9 516.0,730.8 520.0,730.6 524.0,730.4 528.0,730.3 532.0,730.1 536.0,730.0 540.0,729.8 544.0,729.6 548.0,729.5 552.0,729.3 556.0,729.2 560.0,729.0 564.0,728.8 568.0,728.7 572.0,728.5 576.0,728.4 580.0,728.2 584.0,728.0 588.0,727.9 592.0,727.7 596.0,727.6 600.0,727.4 604.0,727.2 608.0,727.1 612.0,726.9 616.0