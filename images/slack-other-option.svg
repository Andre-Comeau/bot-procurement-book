941.1 L828.0,934.1 L832.0,926.6 L836.0,918.6 L840.0,910.1 L844.0,901.0 L848.0,891.4 L852.0,881.3 L856.0,870.6 L860.0,859.4 L864.0,847.6 L868.0,835.3 L872.0,822.4 L876.0,809.0 L880.0,795.0 L884.0,780.4 L888.0,765.2 L892.0,749.5 L896.0,733.2 L900.0,716.2 L904.0,698.7 L908.0,680.6 L912.0,661.9 L916.0,642.7 L920.0,622.8 L924.0,602.3 L928.0,581.1 L932.0,559.4 L936.0,537.1 L940.0,514.1 L944.0,490.6 L948.0,466.4 L952.0,441.5 L956.0,416.1 L960.0,390.0" fill="none" stroke="#d85a30" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="960" cy="390.0" r="7" fill="#d85a30" stroke="#f9f8f5" stroke-width="2"/><circle cx="960" cy="800" r="7" fill="#0064ff" stroke="#f9f8f5" stroke-width="2"/><text x="152" y="316" class="axis" text-anchor="start" fill="#5f5e5a">how many</text><text x="320.0" y="1114" class="axis" text-anchor="middle" fill="#5f5e5a">the plan room</text><text x="620.0" y="1114" class="axis" text-anchor="middle" fill="#5f5e5a">the plan room online</text><text x="860.0" y="1114" class="axis" text-anchor="middle" fill="#5f5e5a">AI makes the call nearly free</text><text x="560.0" y="1142" class="axisnote" text-anchor="middle" fill="#5f5e5a">time, left to right</text><text x="400" y="870" class="lab" text-anchor="middle" fill="#15614d">slack</text><text x="400" y="898" class="note" text-anchor="middle" fill="#2c2c2a">the oak kept the stack of bids</text><text x="400" y="923" class="note" text-anchor="middle" fill="#2c2c2a">small enough for a committee to read;</text><text x="400" y="948" class="note" text-anchor="middle" fill="#2c2c2a">under it, the cushion, the contingency,</text><text x="400" y="973" class="note" text-anchor="middle" fill="#2c2c2a">the long tender, the margin that eats the error</text><text x="880" y="560" class="lab" text-anchor="end" fill="#b6512f">the thicket</text><text x="880" y="588" class="note" text-anchor="end" fill="#2c2c2a">slack released without</text><text x="880" y="614" class="note" text-anchor="end" fill="#2c2c2a">the capacity to meet it</text><line x1="910" y1="360.0" x2="946" y2="360.0" stroke="#d85a30" stroke-width="3.5"/><text x="900" y="366.0" class="note" text-anchor="end" fill="#2c2c2a">bids arriving at the door</text><line x1="176" y1="774" x2="216" y2="774" stroke="#0064ff" stroke-width="3.5"/><text x="226" y="780" class="note" text-anchor="start" fill="#2c2c2a">the attention available to read them</text><line x1="160" y1="334" x2="196" y2="334" stroke="#d85a30" stroke-width="3.5"/><text x="206" y="340" class="legend" text-anchor="start" fill="#5f5e5a">bids per tender</text><line x1="390" y1="334" x2="426" y2="334" stroke="#0064ff" stroke-width="3.5"/><text x="436" y="340" class="legend" text-anchor="start" fill="#5f5e5a">eyes to read them</text><text x="1040" y="334" class="lab" text-anchor="start" fill="#2c2c2a">Two kinds of answer, through the book</text><rect x="1040" y="360" width="480" height="350" rx="8" fill="#e5e7eb" stroke="#555450" stroke-width="3"/><text x="1064" y="404" class="boxtitle" text-anchor="start" fill="#555450">Add slack</text><rect x="1064" y="426" width="8" height="8" fill="#555450"/><text x="1082" y="438" class="item" text-anchor="start" fill="#2c2c2a">A bid cushion for the drawings&#x27; errors</text><rect x="1064" y="452" width="8" height="8" fill="#555450"/><text x="1082" y="464" class="item" text-anchor="start" fill="#2c2c2a">A long tender, a plan room, a committee</text><rect x="1064" y="478" width="8" height="8" fill="#555450"/><text x="1082" y="490" class="item" text-anchor="start" fill="#2c2c2a">The oak: five bids in six lost, as overhead</text><rect x="1064" y="504" width="8" height="8" fill="#555450"/><text x="1082" y="516" class="item" text-anchor="start" fill="#2c2c2a">A contingency for the rest</text><rect x="1064" y="530" width="8" height="8" fill="#555450"/><text x="1082" y="542" class="item" text-anchor="start" fill="#2c2c2a">Changes bought from a supplier of one</text><rect x="1064" y="556" width="8" height="8" fill="#555450"/><text x="1082" y="568" class="item" text-anchor="start" fill="#2c2c2a">Reviews by whoever has time</text><rect x="1064" y="582" width="8" height="8" fill="#555450"/><text x="1082" y="594" class="item" text-anchor="start" fill="#2c2c2a">The margin eats the error; the surety waits</text><rect x="1064" y="608" width="8" height="8" fill="#555450"/><text x="1082" y="620" class="item" text-anchor="start" fill="#2c2c2a">Taylorism and the largest firms plateau</text><text x="1064" y="652" class="tiny" text-anchor="start" fill="#5f5e5a">Construction&#x27;s habit. It no longer works: AI</text><text x="1064" y="675" class="tiny" text-anchor="start" fill="#5f5e5a">removed the slack and left the attention</text><text x="1064" y="698" class="tiny" text-anchor="start" fill="#5f5e5a">needed exactly where it was.</text><rect x="1040" y="730" width="480" height="350" rx="8" fill="#e1f5ee" stroke="#15614d" stroke-width="3"/><text x="1064" y="774" class="boxtitle" text-anchor="start" fill="#15614d">Raise the capacity</text><rect x="1064" y="796" width="8" height="8" fill="#15614d"/><text x="1082" y="808" class="item" text-anchor="start" fill="#2c2c2a">A second opinion on every price</text><rect x="1064" y="822" width="8" height="8" fill="#15614d"/><text x="1082" y="834" class="item" text-anchor="start" fill="#2c2c2a">The tender as a data file</text><rect x="1064" y="848" width="8" height="8" fill="#15614d"/><text x="1082" y="860" class="item" text-anchor="start" fill="#2c2c2a">The same check, the same way, every bid</text><rect x="1064" y="874" width="8" height="8" fill="#15614d"/><text x="1082" y="886" class="item" text-anchor="start" fill="#2c2c2a">A measured miss rate, and a record</text><rect x="1064" y="900" width="8" height="8" fill="#15614d"/><text x="1082" y="912" class="item" text-anchor="start" fill="#2c2c2a">The door open: no cap, no key, no fee</text><rect x="1064" y="926" width="8" height="8" fill="#15614d"/><text x="1082" y="938" class="item" text-anchor="start" fill="#2c2c2a">The evaluator, and the keyholder who signs</text><rect x="1064" y="952" width="8" height="8" fill="#15614d"/><text x="1082" y="964" class="item" text-anchor="start" fill="#2c2c2a">Insurance on the margin picks up the tails</text><rect x="1064" y="978" width="8" height="8" fill="#15614d"/><text x="1082" y="990" class="item" text-anchor="start" fill="#2c2c2a">Three standards: documents, test, sign-off</text><text x="1064" y="1022" class="tiny" text-anchor="start" fill="#5f5e5a">The other option. More data moves faster</text><text x="1064" y="1045" class="tiny" text-anchor="start" fill="#5f5e5a">through the door without anyone acquiring a</text><text x="1064" y="1068" class="tiny" text-anchor="start" fill="#5f5e5a">say they did not have before.</text><text x="80" y="1200" class="foot" text-anchor="start" fill="#5f5e5a">Schematic, not data: the lines show the idea, not counts. The lists are sentences from across the book, shortened.</text></svg>