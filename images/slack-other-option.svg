</style><rect width="1600" height="1240" fill="#f9f8f5"/><text x="80" y="86" class="eyebrow" text-anchor="start">CHAPTER 1 · SLACK, AND THE OTHER OPTION</text><text x="80" y="148" class="title" text-anchor="start">Slack, and the other option</text><text x="80" y="190" class="dek" text-anchor="start">An organization facing more than it can process has two kinds of answer, Galbraith wrote: need less, which in construction means slack,</text><text x="80" y="218" class="dek" text-anchor="start">or raise its capacity to process information. AI took the slack away and left the attention needed exactly where it was.</text><polygon points="160.0,1020.0 164.0,1019.8 168.0,1019.6 172.0,1019.4 176.0,1019.2 180.0,1019.0 184.0,1018.8 188.0,1018.6 192.0,1018.4 196.0,1018.2 200.0,1018.0 204.0,1017.8 208.0,1017.6 212.0,1017.4 216.0,1017.2 220.0,1017.0 224.0,1016.8 228.0,1016.6 232.0,1016.4 236.0,1016.2 240.0,1016.0 244.0,1015.8 248.0,1015.6 252.0,1015.4 256.0,1015.2 260.0,1015.0 264.0,1014.8 268.0,1014.6 272.0,1014.4 276.0,1014.2 280.0,1014.0 284.0,1013.8 288.0,1013.6 292.0,1013.4 296.0,1013.2 300.0,1013.0 304.0,1012.8 308.0,1012.6 312.0,1012.4 316.0,1012.2 320.0,1012.0 324.0,1011.8 328.0,1011.6 332.0,1011.4 336.0,1011.2 340.0,1011.0 344.0,1010.8 348.0,1010.6 352.0,1010.4 356.0,1010.2 360.0,1010.0 364.0,1009.8 368.0,1009.6 372.0,1009.4 376.0,1009.2 380.0,1009.0 384.0,1008.8 388.0,1008.6 392.0,1008.4 396.0,1008.2 400.0,1008.0 404.0,1007.8 408.0,1007.6 412.0,1007.4 416.0,1007.2 420.0,1007.0 424.0,1006.8 428.0,1006.6 432.0,1006.4 436.0,1006.2 440.0,1006.0 444.0,1005.8 448.0,1005.6 452.0,1005.4 456.0,1005.2 460.0,1005.0 464.0,1004.8 468.0,1004.6 472.0,1004.4 476.0,1004.2 480.0,1004.0 484.0,1003.8 488.0,1003.6 492.0,1003.4 496.0,1003.2 500.0,1003.0 504.0,1002.8 508.0,1002.6 512.0,1002.4 516.0,1002.2 520.0,1002.0 524.0,1001.8 528.0,1001.6 532.0,1001.4 536.0,1001.2 540.0,1001.0 544.0,1000.8 548.0,1000.6 552.0,1000.4 556.0,1000.2 560.0,1000.0 564.0,999.8 568.0,999.6 572.0,999.4 576.0,999.2