<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
<style>
  .eyebrow{font-family:Outfit,sans-serif;font-weight:600;font-size:15px;letter-spacing:.16em;fill:#0064ff}
  .title{font-family:'Instrument Serif',Georgia,serif;font-size:54px;fill:#2c2c2a}
  .dek{font-family:Lora,Georgia,serif;font-size:20px;fill:#5f5e5a}
  .name{font-family:'Instrument Serif',Georgia,serif;font-size:36px}
  .ex{font-family:Outfit,sans-serif;font-size:17px}
  .trade{font-family:Lora,Georgia,serif;font-style:italic;font-size:19px}
  .axis{font-family:Outfit,sans-serif;font-weight:600;font-size:14px;letter-spacing:.14em}
  .axis-s{font-family:Lora,Georgia,serif;font-style:italic;font-size:16px}
  .tag{font-family:Outfit,sans-serif;font-weight:600;font-size:13px;letter-spacing:.14em}
  .cname{font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-size:24px}
  .route{font-family:'Instrument Serif',Georgia,serif;font-size:24px;paint-order:stroke;stroke:#f9f8f5;stroke-width:6px;stroke-linejoin:round}
  .route-s{font-family:Outfit,sans-serif;font-size:14px;paint-order:stroke;stroke:#f9f8f5;stroke-width:6px;stroke-linejoin:round}
  .drift{font-family:Outfit,sans-serif;font-weight:500;font-size:14px}
  .foot{font-family:Outfit,sans-serif;font-size:14px;fill:#5f5e5a}
</style>
<rect width="1600" height="1200" fill="#f9f8f5"/>
<defs><marker id="ah-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d85a30"/></marker><marker id="ah-i" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c2c2a"/></marker></defs>
<text x="80" y="86" class="eyebrow" text-anchor="start">CHAPTER 3 · CHOOSING A DELIVERY METHOD</text>
<text x="80" y="148" class="title" text-anchor="start">Who works for whom, and how they deal</text>
<text x="80" y="190" class="dek" text-anchor="start">Two questions place every way to build: does the other party work for itself or for you,</text>
<text x="80" y="218" class="dek" text-anchor="start">and do you get there by competing or by cooperating?</text>
<rect x="256" y="306" width="608" height="368" rx="14" fill="#faece7" stroke="#d85a30" stroke-width="1.5"/>
<text x="290" y="374" class="name" text-anchor="start" fill="#2c2c2a">Hard bid</text>
<text x="290" y="414" class="ex" text-anchor="start" fill="#9e3d18">Lump-sum Design-Build</text>
<text x="290" y="440" class="ex" text-anchor="start" fill="#9e3d18">The build, once tendered</text>
<text x="290" y="480" class="trade" text-anchor="start" fill="#2c2c2a">You trade trust in the counterparty</text>
<text x="290" y="506" class="trade" text-anchor="start" fill="#2c2c2a">for rock-bottom pricing.</text>
<rect x="876" y="306" width="608" height="368" rx="14" fill="#e1f5ee" stroke="#0f6e56" stroke-width="1.5"/>
<text x="910" y="374" class="name" text-anchor="start" fill="#2c2c2a">Partnership</text>
<text x="910" y="414" class="ex" text-anchor="start" fill="#085041">Principals entangled in a common interest</text>
<text x="910" y="454" class="trade" text-anchor="start" fill="#2c2c2a">You trade a higher share of the benefits</text>
<text x="910" y="480" class="trade" text-anchor="start" fill="#2c2c2a">for significantly less management effort.</text>
<rect x="256" y="686" width="608" height="368" rx="14" fill="#f3f4f6" stroke="#5f5e5a" stroke-width="1.5"/>
<text x="290" y="860" class="name" text-anchor="start" fill="#2c2c2a">Construction Manager</text>
<text x="290" y="900" class="ex" text-anchor="start" fill="#5f5e5a">Two agents, designer and builder,</text>
<text x="290" y="926" class="ex" text-anchor="start" fill="#5f5e5a">acting as checks on each other</text>
<text x="290" y="966" class="trade" text-anchor="start" fill="#2c2c2a">You trade accountability for a mild</text>
<text x="290" y="992" class="trade" text-anchor="start" fill="#2c2c2a">dose of certainty and optionality.</text>
<rect x="876" y="686" width="608" height="368" rx="14" fill="#e6efff" stroke="#0064ff" stroke-width="1.5"/>
<text x="910" y="860" class="name" text-anchor="start" fill="#2c2c2a">Cost plus</text>
<text x="910" y="900" class="ex" text-anchor="start" fill="#004fcc">The design consultant</text>
<text x="910" y="926" class="ex" text-anchor="start" fill="#004fcc">Cost-plus Design-Build</text>
<text x="910" y="966" class="trade" text-anchor="start" fill="#2c2c2a">You trade cost certainty</text>
<text x="910" y="992" class="trade" text-anchor="start" fill="#2c2c2a">for optionality.</text>
<text x="220" y="480.0" class="axis" text-anchor="end" fill="#5f5e5a">PRINCIPAL TO</text>
<text x="220" y="500.0" class="axis" text-anchor="end" fill="#5f5e5a">PRINCIPAL</text>
<text x="220" y="524.0" class="axis-s" text-anchor="end" fill="#5f5e5a">works for itself</text>
<text x="220" y="860.0" class="axis" text-anchor="end" fill="#5f5e5a">PRINCIPAL TO</text>
<text x="220" y="880.0" class="axis" text-anchor="end" fill="#5f5e5a">AGENT</text>
<text x="220" y="904.0" class="axis-s" text-anchor="end" fill="#5f5e5a">works for you</text>
<text x="560.0" y="1100" class="axis" text-anchor="middle" fill="#5f5e5a">COMPETITIVE</text>
<text x="1180.0" y="1100" class="axis" text-anchor="middle" fill="#5f5e5a">COOPERATIVE</text>
<text x="226" y="274" class="tag" text-anchor="start" fill="#9e3d18">↖ CHEAP AND STRESSFUL</text>
<text x="1496" y="1100" class="tag" text-anchor="end" fill="#004fcc">PEACEFUL AND EXPENSIVE ↘</text>
<rect x="662.0" y="557.0" width="416" height="246" rx="18" fill="#f9f8f5"/>
<rect x="670.0" y="565.0" width="400" height="230" rx="14" fill="#ffffff" stroke="#2c2c2a" stroke-width="2"/>
<text x="870" y="615.0" class="name" text-anchor="middle" fill="#2c2c2a">General Contractor</text>
<text x="870" y="643.0" class="cname" text-anchor="middle" fill="#2c2c2a">with a Consultant</text>
<text x="870" y="675.0" class="ex" text-anchor="middle" fill="#5f5e5a">Design as an agent, then build by tender</text>
<text x="870" y="715.0" class="trade" text-anchor="middle" fill="#2c2c2a">The synthesis: optionality where</text>
<text x="870" y="741.0" class="trade" text-anchor="middle" fill="#2c2c2a">it has the most leverage, competition</text>
<text x="870" y="767.0" class="trade" text-anchor="middle" fill="#2c2c2a">for the rest.</text>
<line x1="1430" y1="278" x2="810" y2="278" stroke="#d85a30" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#ah-a)"/>
<text x="830" y="264" class="drift" text-anchor="middle" fill="#9e3d18">Profits = Margin × Velocity: velocity fades, and the Principal returns to the hungry parties</text>
<text x="80" y="1130" class="foot" text-anchor="start">Off the grid: self-performance, where the Principal and the Agent are one person.</text>
<text x="80" y="1182" class="foot" text-anchor="start">The diagonal runs from cheap and stressful to peaceful and expensive; the centre square balances both axes.</text>
<text x="80" y="1156" class="foot" text-anchor="start">Design-Build lands in two squares: a lump sum keeps it Principal to Principal; cost plus makes it Principal to Agent.</text>
</svg>