<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" width="1600" height="1180"><style>
.eyebrow{font:600 22px "IBM Plex Sans",Arial,sans-serif;letter-spacing:.12em;fill:#5f5e5a}
.title{font:700 50px Georgia,"Times New Roman",serif;fill:#2c2c2a}
.dek{font:400 24px "IBM Plex Sans",Arial,sans-serif;fill:#5f5e5a}
.colhead{font:600 20px "IBM Plex Sans",Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase}
.ver{font:600 20px "IBM Plex Sans",Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase}
.lab{font:700 32px Georgia,serif}
.cell{font:600 23px "IBM Plex Sans",Arial,sans-serif}
.note{font:400 21px "IBM Plex Sans",Arial,sans-serif}
.foot{font:italic 400 19px "IBM Plex Sans",Arial,sans-serif}
</style><rect width="1600" height="1180" fill="#f9f8f5"/><text x="80" y="70" class="eyebrow" text-anchor="start">SCHEMATIC, NOT DATA</text><text x="80" y="135" class="title" text-anchor="start">From the signer to the bot that bids on its own</text><text x="80" y="180" class="dek" text-anchor="start">Each rung trusts the bot a little further, and each needs the one below it.</text><line x1="120" y1="260" x2="120" y2="1080" stroke="#2c2c2a" stroke-width="8"/><line x1="200" y1="260" x2="200" y2="1080" stroke="#2c2c2a" stroke-width="8"/><text x="700" y="250" class="colhead" text-anchor="start" fill="#5f5e5a">Who signs</text><text x="1130" y="250" class="colhead" text-anchor="start" fill="#5f5e5a">Who carries a miss</text><line x1="120" y1="1040" x2="200" y2="1040" stroke="#2c2c2a" stroke-width="8"/><rect x="240" y="890" width="1280" height="170" rx="10" fill="#ffffff" stroke="#d6d3cc" stroke-width="2"/><text x="264" y="934" class="ver" text-anchor="start" fill="#5f5e5a">Version 1.0</text><text x="264" y="974" class="lab" text-anchor="start" fill="#2c2c2a">Momentum</text><text x="264" y="1008" class="note" text-anchor="start" fill="#5f5e5a">One trade first. The template published,</text><text x="264" y="1036" class="note" text-anchor="start" fill="#5f5e5a">and every reading signed by a person.</text><text x="700" y="974" class="cell" text-anchor="start" fill="#2c2c2a">A person signs every line</text><text x="1130" y="974" class="cell" text-anchor="start" fill="#d85a30">The bidder carries every miss</text><line x1="120" y1="845" x2="200" y2="845" stroke="#2c2c2a" stroke-width="8"/><rect x="240" y="695" width="1280" height="170" rx="10" fill="#ffffff" stroke="#d6d3cc" stroke-width="2"/><text x="264" y="739" class="ver" text-anchor="start" fill="#5f5e5a">Version 2.0</text><text x="264" y="779" class="lab" text-anchor="start" fill="#2c2c2a">Proof of work</text><text x="264" y="813" class="note" text-anchor="start" fill="#5f5e5a">The evaluator in an owner&#x27;s hands, and the</text><text x="264" y="841" class="note" text-anchor="start" fill="#5f5e5a">first tenders issued with the template.</text><text x="700" y="779" class="cell" text-anchor="start" fill="#2c2c2a">A named person signs each reading</text><text x="1130" y="779" class="cell" text-anchor="start" fill="#d85a30">A pilot policy, on a few bidders</text><line x1="120" y1="650" x2="200" y2="650" stroke="#2c2c2a" stroke-width="8"/><rect x="240" y="500" width="1280" height="170" rx="10" fill="#ffffff" stroke="#d6d3cc" stroke-width="2"/><text x="264" y="544" class="ver" text-anchor="start" fill="#5f5e5a">Version 3.0</text><text x="264" y="584" class="lab" text-anchor="start" fill="#2c2c2a">The working model</text><text x="264" y="618" class="note" text-anchor="start" fill="#5f5e5a">The tool test built from the signed readings,</text><text x="264" y="646" class="note" text-anchor="start" fill="#5f5e5a">with a published range.</text><text x="700" y="584" class="cell" text-anchor="start" fill="#2c2c2a">A person looks at what the test flags</text><text x="1130" y="584" class="cell" text-anchor="start" fill="#d85a30">Margin insurance on checked bids</text><line x1="120" y1="455" x2="200" y2="455" stroke="#2c2c2a" stroke-width="8"/><rect x="240" y="305" width="1280" height="170" rx="10" fill="#e1f5ee" stroke="#0f6e56" stroke-width="3"/><text x="264" y="349" class="ver" text-anchor="start" fill="#0f6e56">The goal</text><text x="264" y="389" class="lab" text-anchor="start" fill="#2c2c2a">Autonomous bidding</text><text x="264" y="423" class="note" text-anchor="start" fill="#5f5e5a">The bot bids on its own, backed by the test,</text><text x="264" y="451" class="note" text-anchor="start" fill="#5f5e5a">a public reference price and cover.</text><text x="700" y="389" class="cell" text-anchor="start" fill="#2c2c2a">Signing is a choice, not a rule</text><text x="1130" y="389" class="cell" text-anchor="start" fill="#d85a30">Cover sold with the bot</text><text x="80" y="1150" class="foot" text-anchor="start" fill="#5f5e5a">The project is working toward the bottom rung now. Chapters 13, 17 and 19 describe the rest.</text></svg>