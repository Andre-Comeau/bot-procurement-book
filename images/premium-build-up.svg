<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" width="1600" height="760"><style>
.eyebrow{font:600 22px "IBM Plex Sans",Arial,sans-serif;letter-spacing:.12em;fill:#5f5e5a}
.title{font:700 50px Georgia,"Times New Roman",serif;fill:#2c2c2a}
.dek{font:400 24px "IBM Plex Sans",Arial,sans-serif;fill:#5f5e5a}
.lab{font:700 30px Georgia,serif}
.note{font:400 22px "IBM Plex Sans",Arial,sans-serif}
.inbar{font:600 24px "IBM Plex Sans",Arial,sans-serif}
.big{font:700 48px Georgia,serif}
.foot{font:italic 400 19px "IBM Plex Sans",Arial,sans-serif}
</style><rect width="1600" height="760" fill="#f9f8f5"/><text x="80" y="70" class="eyebrow" text-anchor="start">THE PROJECT&#x27;S INSURANCE MODEL</text><text x="80" y="135" class="title" text-anchor="start">What the premium pays for</text><text x="80" y="180" class="dek" text-anchor="start">The insurer&#x27;s lowest price on one $8 million job won, for a typical bot whose bids are checked.</text><text x="80" y="312" class="lab" text-anchor="start" fill="#2c2c2a">Sold on its own</text><text x="80" y="344" class="note" text-anchor="start" fill="#5f5e5a">through a broker</text><rect x="380" y="280" width="495" height="80" fill="#0f6e56"/><rect x="875" y="280" width="405" height="80" fill="#d85a30"/><text x="398" y="330" class="inbar" text-anchor="start" fill="#ffffff">about $6,600 in expected payouts</text><text x="1078" y="330" class="inbar" text-anchor="middle" fill="#ffffff">$5,400</text><text x="1304" y="316" class="big" text-anchor="start" fill="#2c2c2a">$12,000</text><text x="1304" y="350" class="note" text-anchor="start" fill="#5f5e5a">0.15% of the contract</text><text x="879" y="398" class="note" text-anchor="start" fill="#d85a30">Commission, running costs, capital for a bad year</text><text x="80" y="522" class="lab" text-anchor="start" fill="#2c2c2a">Sold by the vendor</text><text x="80" y="554" class="note" text-anchor="start" fill="#5f5e5a">with the bot</text><rect x="380" y="490" width="488" height="80" fill="#0f6e56"/><rect x="868" y="490" width="172" height="80" fill="#d85a30"/><text x="398" y="540" class="inbar" text-anchor="start" fill="#ffffff">about $6,500 in expected payouts</text><text x="954" y="540" class="inbar" text-anchor="middle" fill="#ffffff">$2,300</text><text x="1064" y="526" class="big" text-anchor="start" fill="#2c2c2a">$8,800</text><text x="1064" y="560" class="note" text-anchor="start" fill="#5f5e5a">0.11% of the contract</text><text x="872" y="608" class="note" text-anchor="start" fill="#d85a30">Smaller commission, claims handled automatically, a yearly cap</text><text x="80" y="720" class="foot" text-anchor="start" fill="#5f5e5a">Model figures on stated assumptions; a real policy would be priced from a bidder&#x27;s own books.</text></svg>